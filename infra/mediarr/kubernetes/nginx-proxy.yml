apiVersion: v1
kind: ConfigMap
metadata:
  name: mediarr-nginx-proxy
  namespace: mediarr
data:
  # Edit these locations to change paths or upstream services. Set the matching
  # URL Base in each app to the same path (for example, /lidarr).
  default.conf: |
    server {
      listen 80;
      server_name _;

      location = / {
        return 302 /lazylibrarian/;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location = /lazylibrarian {
        return 308 /lazylibrarian/;
      }
      location /lazylibrarian/ {
        proxy_pass http://lazylibrarian:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /lazylibrarian;
      }

      location = /lidarr {
        return 308 /lidarr/;
      }
      location /lidarr/ {
        proxy_pass http://lidarr:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /lidarr;
      }

      location = /prowlarr {
        return 308 /prowlarr/;
      }
      location /prowlarr/ {
        proxy_pass http://prowlarr:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /prowlarr;
      }

      location = /radarr {
        return 308 /radarr/;
      }
      location /radarr/ {
        proxy_pass http://radarr:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /radarr;
      }

      location = /sonarr {
        return 308 /sonarr/;
      }
      location /sonarr/ {
        proxy_pass http://sonarr:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /sonarr;
      }

      location = /whisparr {
        return 308 /whisparr/;
      }
      location /whisparr/ {
        proxy_pass http://whisparr:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /whisparr;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediarr-nginx-proxy
  namespace: mediarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediarr-nginx-proxy
  template:
    metadata:
      labels:
        app: mediarr-nginx-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: mediarr-nginx-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: mediarr-nginx-proxy
  namespace: mediarr
spec:
  type: NodePort
  selector:
    app: mediarr-nginx-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      # Change this to another unused port in the cluster's NodePort range.
      nodePort: 30080
